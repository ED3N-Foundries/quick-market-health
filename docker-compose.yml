name: quick-market-health

services:
  quick-market-health:
    container_name: quick-market-health
    build: .
    image: ed3n/quick-market-health:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3101}:3101"
    environment:
      PORT: 3101
      # When this compose runs on the same docker network as quick-market,
      # point at the API container. For host-local quick-market use
      # TARGET_URL=http://host.docker.internal:3001
      TARGET_URL: ${TARGET_URL:-http://quick-market:3001}
      INTERNAL_URL: ${INTERNAL_URL:-}
      AGENT_URL: ${AGENT_URL:-http://quick-market-agent:3011}
      WS_TARGET: ${WS_TARGET:-}
      RPC_URL: ${RPC_URL:-}
      CHECK_INTERVAL_MS: ${CHECK_INTERVAL_MS:-10000}
      HISTORY_N: ${HISTORY_N:-180}
      REFRESH_MS: ${REFRESH_MS:-5000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-8000}
      # Container state + log tails need the engine socket. The standalone
      # image runs as root, so no group fix-up is needed here (the hardened
      # deploy image drops to bun:bun and uses DOCKER_GID instead).
      DOCKER_SOCK: ${DOCKER_SOCK:-}
      DOCKER_GID: ${DOCKER_GID:-}
      DOCKER_CONTAINERS: ${DOCKER_CONTAINERS:-quick-market,quick-market-agent}
      DOCKER_TIMEOUT_MS: ${DOCKER_TIMEOUT_MS:-2500}
      DOCKER_LOGS_TAIL: ${DOCKER_LOGS_TAIL:-200}
    # Uncomment to enable the containers/logs cards:
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
